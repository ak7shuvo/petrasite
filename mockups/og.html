<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PETRA OG image</title>
<style>
  @font-face { font-family: "MONT"; src: url("../node_modules/@fontsource-variable/montserrat/files/montserrat-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0F172A; color: #F1F5F9; font-family: "MONT", "Montserrat", sans-serif; position: relative; overflow: hidden;
    background-image: linear-gradient(to right, rgba(241,245,249,.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(241,245,249,.05) 1px, transparent 1px);
    background-size: 64px 64px; background-position: -1px -1px;
  }
  .glow { position: absolute; right: -220px; top: -120px; width: 640px; height: 640px; border-radius: 50%; background: rgba(20,184,166,.16); filter: blur(140px); }
  .frame { position: absolute; inset: 40px; border: 1px solid #263250; }
  .brand { position: absolute; left: 88px; top: 84px; display: flex; align-items: center; gap: 18px; }
  .brand b { font-size: 30px; letter-spacing: .3em; font-weight: 700; }
  .label { position: absolute; left: 88px; top: 176px; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; color: #2DD4BF; }
  h1 { position: absolute; left: 82px; top: 214px; font-size: 96px; line-height: .98; font-weight: 800; letter-spacing: -.06em; }
  h1 span { color: #14B8A6; }
  .chips { position: absolute; left: 88px; bottom: 84px; display: flex; gap: 0; border: 1px solid #263250; }
  .chip { padding: 16px 26px; font-size: 22px; font-weight: 700; letter-spacing: .16em; display: flex; gap: 14px; align-items: baseline; }
  .chip + .chip { border-left: 1px solid #263250; }
  .chip small { font-size: 13px; letter-spacing: .02em; font-weight: 400; color: #AEB8C8; }
  .bar { position: absolute; left: 40px; top: 40px; width: 6px; height: 120px; background: #14B8A6; }
  .url { position: absolute; right: 88px; bottom: 98px; font-size: 14px; letter-spacing: .2em; color: #7C889C; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="bar"></div>
  <div class="brand">
    <img src="../public/logo-mark.png" width="52" height="52" alt="">
    <b>PETRA</b>
  </div>
  <div class="label">Hospitality software · Bangladesh</div>
  <h1>Software that runs<br><span>hospitality.</span></h1>
  <div class="chips">
    <div class="chip">PMS <small>Property</small></div>
    <div class="chip">POS <small>Point of sale</small></div>
    <div class="chip">DMS <small>Distribution</small></div>
  </div>
  <div class="url">PETRA Software Solutions</div>
</body>
</html>
